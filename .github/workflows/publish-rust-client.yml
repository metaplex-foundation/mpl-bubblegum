name: Publish Rust Client

run-name: Publish Rust Client (${{ inputs.level }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      level:
        description: Level
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, rc, beta, alpha, release, version]
      version:
        description: Version (when level is `version`)
        required: false
        type: string
      dry_run:
        description: Dry run
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  # One Rust publish per crate at a time.
  group: publish-rust-client
  cancel-in-progress: false

jobs:
  build_programs:
    name: Programs
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@b7f2319cc97d9c8c052f24be1a709c88961dc1a8 # ci/faster-ci, v2.1.0 candidate
    permissions:
      contents: read

  test_rust_client:
    name: Rust client
    needs: build_programs
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@b7f2319cc97d9c8c052f24be1a709c88961dc1a8 # ci/faster-ci, v2.1.0 candidate
    permissions:
      contents: read
    with:
      features: --all-features
      runner: ubuntu-latest-16-cores

  publish:
    name: Rust client
    needs: test_rust_client
    uses: metaplex-foundation/actions/.github/workflows/publish-rust-client.yml@b7f2319cc97d9c8c052f24be1a709c88961dc1a8 # ci/faster-ci, v2.1.0 candidate
    permissions:
      contents: write
      pull-requests: write
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    with:
      level: ${{ inputs.level }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
