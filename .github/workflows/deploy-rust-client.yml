name: Deploy Rust Client

# Make dry runs distinguishable from real publishes in the Actions run list.
run-name: Deploy Rust Client (${{ inputs.level }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      level:
        description: Level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
          - beta
          - alpha
          - release
          - version
      version:
        description: Version
        required: false
        type: string
      dry_run:
        description: Dry run
        required: true
        default: true
        type: boolean

env:
  CACHE: true

jobs:
  build_programs:
    name: Programs
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit

  build_rust_client:
    name: Rust Client
    uses: ./.github/workflows/build-rust-client.yml
    secrets: inherit

  test_rust_client:
    name: Rust Client
    needs: [build_programs, build_rust_client]
    uses: ./.github/workflows/test-rust-client.yml
    secrets: inherit

  publish_crate:
    name: Rust Client / Publish Crate
    runs-on: ubuntu-latest
    needs: test_rust_client
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load environment variables
        run: cat .github/.env >> $GITHUB_ENV

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ env.RUST_CLIENT_RUST_VERSION }}

      - name: Install cargo-release
        uses: metaplex-foundation/actions/install-cargo-release@v1
        with:
          cache: ${{ env.CACHE }}

      - name: Publish crate
        working-directory: ./clients/rust
        run: |
          if [ "${{ inputs.level }}" == "version" ]; then
            BUMP=${{ inputs.version }}
          else
            BUMP=${{ inputs.level }}
          fi

          if [ "${{ inputs.dry_run }}" == "false" ]; then
            OPTIONS="--no-push --no-tag --no-confirm --execute"
            git config user.name ${{ env.COMMIT_USER_NAME }}
            git config user.email ${{ env.COMMIT_USER_EMAIL }}
          fi

          cargo login ${{ secrets.CRATES_TOKEN }}
          cargo release $BUMP $OPTIONS

          if [ "${{ inputs.dry_run }}" == "false" ]; then
            git reset --soft HEAD~1
          fi

          PROGRAM_VERSION=`grep -E '^version\s*=' Cargo.toml | awk -F '"' '{print $2}'`
          echo PROGRAM_VERSION="${PROGRAM_VERSION}" >> $GITHUB_ENV

      # Branch protection blocks direct pushes to main, so land the version
      # bump through a pull request (same flow as publish-js-client.yml).
      - name: Create release pull request
        if: github.event.inputs.dry_run == 'false'
        # Pinned to a commit SHA because this step runs with write permissions.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: 'chore: Release mpl-bubblegum version ${{ env.PROGRAM_VERSION }}'
          branch: release/rust-client-v${{ env.PROGRAM_VERSION }}
          base: main
          title: 'chore: Release mpl-bubblegum version ${{ env.PROGRAM_VERSION }}'
          body: |
            ## Summary
            - deploy-rust-client workflow published `mpl-bubblegum` `${{ env.PROGRAM_VERSION }}` to crates.io
            - after merging, tag the merge commit as `mpl-bubblegum@v${{ env.PROGRAM_VERSION }}`
          labels: release
