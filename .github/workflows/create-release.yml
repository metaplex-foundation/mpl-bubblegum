name: Create release

on:
  workflow_dispatch:
    inputs:
      program:
        description: Program
        required: true
        default: bubblegum
        type: choice
        options: [bubblegum]
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      type:
        description: Release type
        required: true
        default: solana
        type: choice
        options: [solana, svm, commit]
      git_ref:
        description: Commit hash or branch to create the release from
        required: false
        type: string
        default: main

permissions: {}

concurrency:
  # One release per program at a time.
  group: create-release-${{ inputs.program }}
  cancel-in-progress: false

jobs:
  build_programs:
    name: Programs
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ inputs.git_ref }}

  test_programs:
    name: Programs
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      program_matrix: '["${{ inputs.program }}"]'
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores

  test_js:
    name: JS client
    needs: build_programs
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    secrets:
      READ_API_RPC_DEVNET: ${{ secrets.READ_API_RPC_DEVNET }}
    with:
      git_ref: ${{ inputs.git_ref }}

  test_rust:
    name: Rust client
    needs: build_programs
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores

  create_release:
    name: Program
    needs: [test_js, test_rust, test_programs]
    uses: metaplex-foundation/actions/.github/workflows/create-release.yml@772e5a7cf7408fb8346dccb5665f0502c33e9dbb # v2.0.0
    permissions:
      contents: write
    with:
      program: ${{ inputs.program }}
      bump: ${{ inputs.bump }}
      type: ${{ inputs.type }}
      git_ref: ${{ inputs.git_ref }}
