name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag, commit hash, or branch that was deployed
        required: true
        type: string
      program:
        description: Program
        required: true
        default: bubblegum
        type: choice
        options: [bubblegum]
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options: [mainnet-beta, devnet]

permissions: {}

jobs:
  verify:
    name: Program
    uses: metaplex-foundation/actions/.github/workflows/verify-program.yml@b7f2319cc97d9c8c052f24be1a709c88961dc1a8 # ci/faster-ci, v2.1.0 candidate
    permissions:
      contents: read
    secrets:
      RPC_URL: >-
        ${{ inputs.cluster == 'devnet' && secrets.DEVNET_RPC
         || inputs.cluster == 'mainnet-beta' && secrets.MAINNET_RPC
         || '' }}
      PROGRAM_ID_KEYPAIR: ${{ secrets.BUBBLEGUM_ID }}
    with:
      program: ${{ inputs.program }}
      cluster: ${{ inputs.cluster }}
      git_ref: ${{ inputs.git_ref }}
