name: Publish JS Client

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/bubblegum@0.13.0) or commit to publish from
        required: false
        type: string
        default: ''
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, prerelease, prepatch, preminor, premajor]
      tag:
        description: NPM tag (and preid for pre-releases)
        required: true
        type: string
        default: latest
      create_release:
        description: Open the release pull request and deploy docs
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  # One JS publish at a time: each bumps the version and opens a release PR.
  group: publish-js-client
  cancel-in-progress: false

jobs:
  check_tag:
    name: Check tag
    runs-on: ubuntu-latest
    permissions:
      # Confirms the release tag exists and resolves the ref to a commit.
      contents: read
    outputs:
      type: ${{ steps.set_type.outputs.type }}
      sha: ${{ steps.set_type.outputs.sha }}
    steps:
      - name: Check tag
        id: set_type
        env:
          GIT_REF: ${{ inputs.git_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A program release tag was already built and tested when it was cut.
          case "$GIT_REF" in
            release/bubblegum@*) TYPE=release ;;
            release/*@*) echo "::error::'$GIT_REF' is not a release tag of this repository (expected release/bubblegum@<version>)"; exit 1 ;;
            *) TYPE=ref ;;
          esac
          if [ "$TYPE" = release ]; then
            # Only an existing tag skips build and test; a branch named like one does not.
            OBJ="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GIT_REF}" --jq '.object.type + " " + .object.sha')" \
              || { echo "::error::'$GIT_REF' is not an existing tag of this repository"; exit 1; }
            read -r OBJ_TYPE SHA <<< "$OBJ"
            if [ "$OBJ_TYPE" = tag ]; then
              # Annotated tag: follow it to the commit.
              SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq .object.sha)"
            fi
          elif [ -z "$GIT_REF" ]; then
            SHA="$GITHUB_SHA"
          else
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GIT_REF}" --jq .sha)" \
              || { echo "::error::'$GIT_REF' is not a commit, branch or tag of this repository"; exit 1; }
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$GIT_REF -> $SHA ($TYPE)"

  build_programs:
    name: Programs
    if: needs.check_tag.outputs.type == 'ref'
    needs: check_tag
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}

  test_js:
    name: JS client
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    secrets:
      READ_API_RPC_DEVNET: ${{ secrets.READ_API_RPC_DEVNET }}
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}

  publish:
    name: JS client
    if: |
      !cancelled() && !failure()
      && needs.check_tag.result == 'success'
      && (needs.check_tag.outputs.type == 'release'
          || (needs.build_programs.result == 'success'
          && needs.test_js.result == 'success'))
    needs: [check_tag, build_programs, test_js]
    uses: metaplex-foundation/actions/.github/workflows/publish-js-client.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}
      bump: ${{ inputs.bump }}
      tag: ${{ inputs.tag }}
      create_release: ${{ inputs.create_release }}
      deploy_docs: true
