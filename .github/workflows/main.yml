name: Main

# Thin orchestrator over the shared workflows in metaplex-foundation/actions.
# Repository facts live in .github/.env (toolchain pins), .github/programs.json
# (program descriptors) and .github/file-filters.yml (change detection).

on:
  push:
    branches: [main]
  pull_request: {}

permissions: {}

jobs:
  changes:
    name: Detect changes
    uses: metaplex-foundation/actions/.github/workflows/detect-changes.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read
      pull-requests: read

  build_programs:
    name: Programs
    if: needs.changes.outputs.any == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read

  test_programs:
    name: Programs
    if: needs.changes.outputs.programs == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}
      runner: ubuntu-latest-16-cores

  generate_clients:
    name: Generate clients
    if: needs.changes.outputs.any == 'true'
    needs: changes
    uses: metaplex-foundation/actions/.github/workflows/generate-clients.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read

  test_js:
    name: JS Client
    if: needs.changes.outputs.js_client == 'true'
    needs: [changes, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read
    secrets:
      READ_API_RPC_DEVNET: ${{ secrets.READ_API_RPC_DEVNET }}

  test_rust_client:
    name: Rust Client
    if: needs.changes.outputs.rust_client == 'true'
    needs: [changes, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@e254cd631b3f153962713348579b5080ccc74cd2 # v2.1.1
    permissions:
      contents: read
    with:
      features: --all-features
      runner: ubuntu-latest-16-cores
