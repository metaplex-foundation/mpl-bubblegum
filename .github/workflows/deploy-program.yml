name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/bubblegum@0.13.0) or commit to deploy
        required: true
        type: string
        default: release/bubblegum@0.13.0
      program:
        description: Program
        required: true
        default: bubblegum
        type: choice
        options: [bubblegum]
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
          - sonic-devnet
          - sonic-testnet
          - eclipse-mainnet
          - eclipse-devnet
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  # One deploy per program and cluster at a time; a running deploy is never cancelled.
  group: deploy-${{ inputs.program }}-${{ inputs.cluster }}
  cancel-in-progress: false

jobs:
  check_tag:
    name: Check tag
    runs-on: ubuntu-latest
    permissions:
      # Confirms the release tag exists and resolves the ref to a commit.
      contents: read
    outputs:
      type: ${{ steps.set_type.outputs.type }}
      sha: ${{ steps.set_type.outputs.sha }}
    steps:
      - name: Check tag
        id: set_type
        env:
          GIT_REF: ${{ inputs.git_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROGRAM: ${{ inputs.program }}
        run: |
          # A release tag deploys the asset attached to the GitHub release; any
          # other ref is built and tested first.
          case "$PROGRAM" in
            bubblegum) TAG=bubblegum ;;
            *) echo "::error::unknown program '$PROGRAM'"; exit 1 ;;
          esac
          if [[ "$GIT_REF" == release/*@* ]]; then
            if [[ "$GIT_REF" != "release/${TAG}@"* ]]; then
              echo "::error::'$GIT_REF' is not a release tag of $PROGRAM (expected release/${TAG}@<version>)"
              exit 1
            fi
            TYPE=release
          else
            TYPE=ref
          fi
          if [ "$TYPE" = release ]; then
            # Only an existing tag skips build and test; a branch named like one does not.
            OBJ="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GIT_REF}" --jq '.object.type + " " + .object.sha')" \
              || { echo "::error::'$GIT_REF' is not an existing tag of this repository"; exit 1; }
            read -r OBJ_TYPE SHA <<< "$OBJ"
            if [ "$OBJ_TYPE" = tag ]; then
              # Annotated tag: follow it to the commit.
              SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq .object.sha)"
            fi
          elif [ -z "$GIT_REF" ]; then
            SHA="$GITHUB_SHA"
          else
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GIT_REF}" --jq .sha)" \
              || { echo "::error::'$GIT_REF' is not a commit, branch or tag of this repository"; exit 1; }
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$GIT_REF -> $SHA ($TYPE)"

  build_programs:
    name: Programs
    if: needs.check_tag.outputs.type == 'ref'
    needs: check_tag
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}

  test_programs:
    name: Programs
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    with:
      program_matrix: '["${{ inputs.program }}"]'
      git_ref: ${{ needs.check_tag.outputs.sha }}
      runner: ubuntu-latest-16-cores

  test_js:
    name: JS client
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    secrets:
      READ_API_RPC_DEVNET: ${{ secrets.READ_API_RPC_DEVNET }}
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}

  test_rust:
    name: Rust client
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ needs.check_tag.outputs.sha }}
      runner: ubuntu-latest-16-cores

  deploy:
    name: Program
    if: |
      !cancelled() && !failure()
      && needs.check_tag.result == 'success'
      && (needs.check_tag.outputs.type == 'release'
          || (needs.build_programs.result == 'success'
          && needs.test_js.result == 'success'
          && needs.test_programs.result == 'success'
          && needs.test_rust.result == 'success'))
    needs: [check_tag, build_programs, test_js, test_programs, test_rust]
    uses: metaplex-foundation/actions/.github/workflows/deploy-program.yml@7f55495a7da7c3c1884845f75341dd5032a84139 # v2.0.0
    permissions:
      contents: write
    # GitHub Actions cannot look secrets up by a computed name, so the
    # per-cluster secrets are mapped onto the shared workflow's fixed names here.
    secrets:
      RPC_URL: >-
        ${{ inputs.cluster == 'devnet' && secrets.DEVNET_RPC
         || inputs.cluster == 'mainnet-beta' && secrets.MAINNET_RPC
         || inputs.cluster == 'sonic-devnet' && secrets.SONIC_DEVNET_RPC
         || inputs.cluster == 'sonic-testnet' && secrets.SONIC_TESTNET_RPC
         || inputs.cluster == 'eclipse-devnet' && secrets.ECLIPSE_DEVNET_RPC
         || inputs.cluster == 'eclipse-mainnet' && secrets.ECLIPSE_MAINNET_RPC
         || '' }}
      PROGRAM_ID_KEYPAIR: ${{ secrets.BUBBLEGUM_ID }}
      DEPLOYER_KEYPAIR: >-
        ${{ startsWith(inputs.cluster, 'sonic') && secrets.BUBBLEGUM_SONIC_DEPLOY_KEY
         || startsWith(inputs.cluster, 'eclipse') && secrets.BUBBLEGUM_ECLIPSE_DEPLOY_KEY
         || '' }}
      SQUADS_BOT_KEY: ${{ secrets.SQUADS_BOT_KEY }}
    with:
      program: ${{ inputs.program }}
      cluster: ${{ inputs.cluster }}
      git_ref: ${{ needs.check_tag.outputs.sha }}
      release_tag: ${{ needs.check_tag.outputs.type == 'release' && inputs.git_ref || '' }}
      dry_run: ${{ inputs.dry_run }}
