name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/bubblegum@0.13.0) or commit to deploy
        required: true
        type: string
        default: release/bubblegum@0.13.0
      program:
        description: Program
        required: true
        default: bubblegum
        type: choice
        options: [bubblegum]
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
          - sonic-devnet
          - sonic-testnet
          - eclipse-mainnet
          - eclipse-devnet
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  check_tag:
    name: Check tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      type: ${{ steps.set_type.outputs.type }}
    steps:
      - name: Check tag
        id: set_type
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          # A release tag deploys the asset attached to the GitHub release; any
          # other ref is built and tested first.
          if [[ "$GIT_REF" == release/*@* ]]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=ref" >> "$GITHUB_OUTPUT"
          fi

  build_programs:
    name: Programs
    if: needs.check_tag.outputs.type == 'ref'
    needs: check_tag
    uses: metaplex-foundation/actions/.github/workflows/build-programs.yml@7afc538992dfe77522d372163d6afe92b10dc15b # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ inputs.git_ref }}

  test_programs:
    name: Programs
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-programs.yml@7afc538992dfe77522d372163d6afe92b10dc15b # v2.0.0
    permissions:
      contents: read
    with:
      program_matrix: '["${{ inputs.program }}"]'
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores

  test_js:
    name: JS client
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-js-client.yml@7afc538992dfe77522d372163d6afe92b10dc15b # v2.0.0
    permissions:
      contents: read
    secrets:
      READ_API_RPC_DEVNET: ${{ secrets.READ_API_RPC_DEVNET }}
    with:
      git_ref: ${{ inputs.git_ref }}

  test_rust:
    name: Rust client
    if: needs.check_tag.outputs.type == 'ref'
    needs: [check_tag, build_programs]
    uses: metaplex-foundation/actions/.github/workflows/test-rust-client.yml@7afc538992dfe77522d372163d6afe92b10dc15b # v2.0.0
    permissions:
      contents: read
    with:
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores

  deploy:
    name: Program
    if: |
      always()
      && (needs.test_js.result == 'success' || needs.test_js.result == 'skipped')
      && (needs.test_programs.result == 'success' || needs.test_programs.result == 'skipped')
      && (needs.test_rust.result == 'success' || needs.test_rust.result == 'skipped')
    needs: [check_tag, test_js, test_programs, test_rust]
    uses: metaplex-foundation/actions/.github/workflows/deploy-program.yml@7afc538992dfe77522d372163d6afe92b10dc15b # v2.0.0
    permissions:
      contents: write
    # GitHub Actions cannot look secrets up by a computed name, so the
    # per-cluster secrets are mapped onto the shared workflow's fixed names here.
    secrets:
      RPC_URL: >-
        ${{ inputs.cluster == 'devnet' && secrets.DEVNET_RPC
         || inputs.cluster == 'mainnet-beta' && secrets.MAINNET_RPC
         || inputs.cluster == 'sonic-devnet' && secrets.SONIC_DEVNET_RPC
         || inputs.cluster == 'sonic-testnet' && secrets.SONIC_TESTNET_RPC
         || inputs.cluster == 'eclipse-devnet' && secrets.ECLIPSE_DEVNET_RPC
         || inputs.cluster == 'eclipse-mainnet' && secrets.ECLIPSE_MAINNET_RPC
         || '' }}
      PROGRAM_ID_KEYPAIR: ${{ secrets.BUBBLEGUM_ID }}
      DEPLOYER_KEYPAIR: >-
        ${{ startsWith(inputs.cluster, 'sonic') && secrets.BUBBLEGUM_SONIC_DEPLOY_KEY
         || startsWith(inputs.cluster, 'eclipse') && secrets.BUBBLEGUM_ECLIPSE_DEPLOY_KEY
         || '' }}
      SQUADS_BOT_KEY: ${{ secrets.SQUADS_BOT_KEY }}
    with:
      program: ${{ inputs.program }}
      cluster: ${{ inputs.cluster }}
      git_ref: ${{ inputs.git_ref }}
      dry_run: ${{ inputs.dry_run }}
